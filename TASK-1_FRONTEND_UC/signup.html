<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Perk Café | Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

<div class="container">

    <div class="left-panel">
        <img src="images/signup.png" alt="Coffee Image" height="1024px" width="512px">
    </div>

    <div class="right-panel">
        <h2>Central Perk Café</h2>
        <h1>Create Your Account</h1>
        <p>Join our digital living room for the finest brews and cozy moments.</p>
        <form>
            <label>Full Name</label>
            <div class="input-box">
                <img src="images/user.png" alt="" height="16px" width="16px">
                <input type="text" placeholder="Phoebe Buffay">
            </div>
            <label>Email Address</label>
            <div class="input-box">
                <img src="images/email.png" alt="" height="16px" width="20px">
                <input type="email" placeholder="smellycat@centralperk.com">
            </div>
            <div class="password-row">
                <div class="password-box">
                    <label>Password</label>
                    <div class="input-box">
                        <img src="images/lock.png" alt="" height="21px" width="16px">
                        <input type="password" placeholder="••••••••">
                    </div>
                </div>
                <div class="password-box">
                    <label>Confirm Password</label>
                    <div class="input-box">
                        <img src="images/lock1.png" alt="" height="20px" width="16px">
                        <input type="password" placeholder="••••••••">
                    </div>
                </div>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the Terms of Service</label>
            </div>
            <button type="submit">Sign Up</button>
        </form>

        <div class="login">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>

        <div class="footer">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Accessibility</a>
        </div>

    </div>
</div>
</body>
</html>
